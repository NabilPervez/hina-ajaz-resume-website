<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hina Ajaz — Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Montserrat:wght@200;300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: {
        preflight: false, // Prevents Tailwind from resetting the base CSS (which ruined the branding earlier)
      },
      theme: {
        extend: {
          colors: {
            "primary": "#D4AF37",
            "muted": "#567C82",
          },
          animation: {
            'radar-sweep': 'spin 4s linear infinite',
            'pulse-slow': 'pulse 5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>
</head>

<body>

  <!-- HERO -->
  <header class="hero container"
    style="height: 100vh; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 60px;">

    <!-- Deconstructed SVG Compass Logo (Star) -->
    <div class="relative w-80 h-80 flex items-center justify-center shrink-0">
      <!-- Outer Coordinate Ring -->
      <svg class="absolute z-10 w-full h-full text-primary/30 animate-[spin_60s_linear_infinite]" fill="none" stroke="currentColor" stroke-width="0.5" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" stroke-dasharray="1 6"></circle>
        <!-- Tick marks -->
        <path d="M50 0 L50 4 M50 96 L50 100 M0 50 L4 50 M96 50 L100 50" stroke-dasharray="2 2" stroke-width="1"></path>
      </svg>
      <!-- Diagonal Axes -->
      <svg class="absolute z-10 w-full h-full text-primary/20" fill="none" stroke="currentColor" stroke-width="0.5" viewBox="0 0 100 100">
        <path d="M15 15 L85 85 M15 85 L85 15" stroke-dasharray="2 4"></path>
      </svg>
      <!-- Inner Broken Star -->
      <svg class="absolute z-20 w-32 h-32 text-primary animate-pulse-slow" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 100 100">
        <!-- Top point -->
        <path d="M50 10 L55 45 L50 50" stroke-dasharray="4 2"></path>
        <path d="M50 10 L45 45 L50 50" stroke-dasharray="2 4"></path>
        <!-- Right point -->
        <path d="M90 50 L55 45 L50 50" stroke-dasharray="3 3"></path>
        <path d="M90 50 L55 55 L50 50" stroke-dasharray="1 2"></path>
        <!-- Bottom point -->
        <path d="M50 90 L45 55 L50 50" stroke-dasharray="5 1"></path>
        <path d="M50 90 L55 55 L50 50" stroke-dasharray="2 2"></path>
        <!-- Left point -->
        <path d="M10 50 L45 55 L50 50" stroke-dasharray="4 4"></path>
        <path d="M10 50 L45 45 L50 50" stroke-dasharray="1 3"></path>
        <!-- Central Node -->
        <circle cx="50" cy="50" fill="currentColor" r="2"></circle>
      </svg>
      <!-- Rotating Measurement Circles -->
      <svg class="absolute z-10 w-48 h-48 text-primary/40 animate-[spin_40s_linear_infinite_reverse]" fill="none" stroke="currentColor" stroke-width="0.5" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="30" stroke-dasharray="8 4"></circle>
        <circle cx="50" cy="50" r="20" stroke-dasharray="2 6"></circle>
      </svg>
    </div>

    <div class="hero-text" style="display: flex; flex-direction: column; justify-content: center;">
      <div class="eyebrow reveal is-visible">Program &amp; Scrum Leadership <span style="margin: 0 10px;">|</span>
        Healthcare &amp; Health-Tech</div>
      <h1 class="name reveal is-visible">Hina Ajaz</h1>
      <div class="role-line reveal is-visible">Senior Project Manager / Scrum Master</div>

    </div>
  </header>

</body>

</html>
